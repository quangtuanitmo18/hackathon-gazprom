[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "productpulse-ai"
version = "0.1.0"
description = "Evidence-grounded support ticket analysis for Intelligence Cup"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
benchmark = ["scikit-learn>=1.5,<2"]
dense = ["sentence-transformers>=3,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
