name: PostgreSQL Problem Registry Integration

on:
  push:
    branches: [feat/postgres-problem-registry]
    paths:
      - '.github/workflows/postgres-registry.yml'
      - 'src/productpulse/incident/registry.py'
      - 'src/productpulse/storage/**'
      - 'tests/storage/**'
      - 'migrations/**'
      - 'alembic.ini'
      - 'pyproject.toml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/productpulse/storage/**'
      - 'tests/storage/**'
      - 'migrations/**'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: productpulse
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: productpulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd='pg_isready -U productpulse -d productpulse_test'
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://productpulse:local_ci_only@127.0.0.1:5432/productpulse_test
      PG_REGISTRY_TEST_URL: postgresql+psycopg://productpulse:local_ci_only@127.0.0.1:5432/productpulse_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install open-source storage dependencies
        run: python -m pip install -e '.[dev,storage]'
      - name: Apply Alembic schema against actual PostgreSQL
        run: alembic upgrade head
      - name: Verify migration head
        run: alembic current --check-heads
      - name: Run all tests including real PostgreSQL integration
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q src
