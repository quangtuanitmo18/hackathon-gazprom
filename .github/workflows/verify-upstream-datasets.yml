name: Verify upstream helpdesk datasets

on:
  push:
    branches:
      - data/verify-upstream-datasets
    paths:
      - .github/workflows/verify-upstream-datasets.yml
      - scripts/datasets/verify_sources.py
      - scripts/datasets/validate_live_adapters.py
      - src/productpulse/data/adapters.py
      - tests/data/test_adapters.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local package
        run: python -m pip install -e .
      - name: Check Python syntax
        run: python -m py_compile scripts/datasets/verify_sources.py scripts/datasets/validate_live_adapters.py
      - name: Download originals and verify schema and checksums
        id: inspect
        continue-on-error: true
        run: python scripts/datasets/verify_sources.py
      - name: Test actual source rows with current adapters
        id: live
        if: steps.inspect.outcome == 'success'
        continue-on-error: true
        run: python scripts/datasets/validate_live_adapters.py
      - name: Copy author-redacted Zenodo source mirror after checksum and privacy sanity checks
        id: mirror
        if: steps.inspect.outcome == 'success' && steps.live.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          d = json.loads(Path('docs/data/source-audit.json').read_text())
          z = d['sources']['zenodo']
          assert z['status'] == 'success'
          assert all(e.get('unmasked_email_pattern_matches') == 0 for e in z['files'].values())
          dest = Path('datasets/public/zenodo-7648117')
          dest.mkdir(parents=True, exist_ok=True)
          for name in ('X_train.csv', 'X_test.csv', 'y_train.csv', 'y_test.csv'):
              e = z['files'][name]
              assert e.get('md5') == e.get('expected_md5') and e.get('rows') > 0
              shutil.copy2(Path('data/raw/zenodo') / name, dest / name)
          print('Zenodo verified files staged for source-controlled mirror')
          PY
      - name: Upload temporary source files to GitHub Actions artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensed-upstream-datasets-cc-by-4
          path: data/raw/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
      - name: Upload live adapter check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-live-adapter-check
          path: docs/data/live-adapter-compatibility.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-schema-and-checksum-audit
          path: docs/data/source-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish aggregate audit report to this branch
        if: always()
        run: |
          if [ -f docs/data/source-audit.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/source-audit.json
            if [ -f docs/data/live-adapter-compatibility.json ]; then
              git add docs/data/live-adapter-compatibility.json
            fi
            if [ -f datasets/public/zenodo-7648117/X_train.csv ]; then
              git add datasets/public/zenodo-7648117/
            fi
            if ! git diff --cached --quiet; then
              git commit -m "docs(data): record verified upstream schema audit [skip ci]"
              git push
            fi
          fi
      - name: Fail if download/verification incomplete
        if: steps.inspect.outcome != 'success' || steps.live.outcome != 'success'
        run: |
          echo "::error::Original dataset download or live adapter checks failed; inspect source-audit.json"
          exit 1
